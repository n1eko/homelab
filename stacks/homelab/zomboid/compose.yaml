services:
  zomboid:
    image: danixu86/project-zomboid-dedicated-server:latest-release@sha256:f86d62f0455a67950a96042580d12d1bdb3acbd8ca2b027ed6794619dbd73833
    container_name: zomboid
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
    env_file:
      - .env
    ports:
      - "16261:16261/udp"
      - "16262:16262/udp"
      - "8766:8766/udp"
      - "8767:8767/udp"
      - "27015:27015/tcp"
      - "16262-16268:16262-16268/tcp"
    volumes:
      - /mnt/docker/zomboid/data:/home/steam/Zomboid
      - /mnt/docker/zomboid/workshop-mods:/home/steam/pz-dedicated/steamapps/workshop
