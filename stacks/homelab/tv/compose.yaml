services:
  homarr:
    container_name: homarr
    image: ghcr.io/homarr-labs/homarr:latest@sha256:1e077fc77d3ad7482376bab964b89cfc8c1f31fe2ddeb5154cf2a1058d40b32d
    restart: unless-stopped
    environment:
      - SECRET_ENCRYPTION_KEY=${HOMARR_SECRET_ENCRYPTION_KEY}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/n1eko/media-server/provision/homarr1/configs:/app/data/configs
      - /home/n1eko/media-server/provision/homarr1/icons:/app/public/icons
      - /home/n1eko/media-server/provision/homarr1/data:/data
    ports:
      - '7575:7575'
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.0
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Madrid
      - PORT=5055
    ports:
      - 5055:5055
    volumes:
      - /home/n1eko/media-server/provision/jellyseerr/config:/app/config
    restart: unless-stopped
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:12.4ubu2604-ls57
    container_name: jellyfin
    group_add:
      - "109"
    environment:
      - DOCKER_MODS=linuxserver/mods:jellyfin-amd
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - JELLYFIN_PublishedServerUrl=192.168.1.128
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/kfd:/dev/kfd
    volumes:
      - /home/n1eko/media-server/provision/jellyfin:/config
      - /home/n1eko/media-server/content/media:/data
      - /mnt/tank/media:/datatank
    ports:
      - 8096:8096
      - 7359:7359/udp
      - 1900:1900/udp
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped
  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls322
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - /home/n1eko/media-server/provision/radarr:/config
      - /home/n1eko/media-server/content:/data
      - /mnt/tank/media:/datatank
      - /mnt/tank:/tank
    ports:
      - "7878:7878"
    restart: unless-stopped
    networks:
      - media-network
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls329
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - /home/n1eko/media-server/provision/sonarr:/config
      - /home/n1eko/media-server/content:/data
      - /mnt/tank/media:/datatank
      - /mnt/tank:/tank
    ports:
      - "8989:8989"
    restart: unless-stopped
    networks:
      - media-network

  bazarr:
    image: lscr.io/linuxserver/bazarr:v1.6.2-ls368
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - /home/n1eko/media-server/provision/bazarr:/config
      - /home/n1eko/media-server/content:/data
      - /mnt/tank/media:/datatank
    ports:
      - "6767:6767"
    restart: unless-stopped
    networks:
      - media-network

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5.5623-ls163
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - /home/n1eko/media-server/provision/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    networks:
      - media-network
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.4_v2.0.15-ls480
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - WEBUI_PORT=32702
      - DOCKER_MODS=ghcr.io/gabe565/linuxserver-mod-vuetorrent
    volumes:
      - /home/n1eko/media-server/provision/qbittorrent:/config
      - /home/n1eko/media-server/content/torrents:/data/torrents
      - /mnt/tank:/tank
    ports:
      - "32702:32702"
      - 32700:32700
      - 32700:32700/udp
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped
    networks:
      - media-network

  shelfmark:
    image: ghcr.io/calibrain/shelfmark:v1.4.0
    container_name: shelfmark
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - /home/n1eko/media-server/provision/shelfmark:/config
      - /home/n1eko/media-server/content/books/ingest:/books
      - /home/n1eko/media-server/content/torrents:/data/torrents
      - /mnt/tank:/tank
    ports:
      - "8084:8084"
    restart: unless-stopped
    networks:
      - media-network

  calibre-web-automated:
    image: crocodilestick/calibre-web-automated:v4.0.8
    container_name: calibre-web-automated
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - NETWORK_SHARE_MODE=false
      - HARDCOVER_TOKEN=${HARDCOVER_TOKEN}
    volumes:
      - /home/n1eko/media-server/provision/calibre-web-automated:/config
      - /home/n1eko/media-server/content/books/ingest:/cwa-book-ingest
      - /mnt/tank/media/books:/calibre-library
    ports:
      - "8083:8083"
    restart: unless-stopped
    networks:
      - media-network
networks:
  media-network:
