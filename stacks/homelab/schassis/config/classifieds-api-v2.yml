spring:
  data:
    mongodb:
      uri: mongodb://n1eko:${MONGODB_ROOT_PASSWORD}@100.114.66.100:27017/classifieds?authSource=admin
  datasource:
    username: n1eko
    hikari:
      connectionTimeout: '20000'
      maximumPoolSize: '15'
    url: jdbc:postgresql://schassis-db:5432/postgres
    password: ${SCHASSIS_POSTGRES_PASSWORD}
  jpa:
    properties:
      hibernate:
        default_batch_fetch_size: '50'
        jdbc:
          batch_size: '25'
          lob:
            non_contextual_creation: 'true'
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: false
    baseline-version: '1'
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: 100.114.66.100:9092
logging:
  level:
    org:
      springframework:
        security: INFO
amazon:
  s3:
    bucket-name: schassis
    endpoint: 6352bb5d001d74f7293586c325098682.r2.cloudflarestorage.com
    access-key: ${SCHASSIS_R2_ACCESS_KEY}
    secret-key: ${SCHASSIS_R2_SECRET_KEY}
    base-url: https://s3-schassis.n1eko.com/images/
similarity:
  backfill:
    enabled: 'false'
classifieds:
  excluded-dealers: autohero,flexicar,ocasionplus,integral motion,integralmotion
inference:
  host: 100.106.222.107
  port: '8000'
management:
  server:
    port: '15202'
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
        exclude: env,beans,heapdump,threaddump,shutdown,configprops,mappings
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: classifieds-api
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
          client:
            requests: true
            calls: true
        kafka:
          consumer:
            duration: true
        scheduler:
          job:
            duration: true
scheduler:
  clean-duplicates:
    cron: '0 0 */10 * * *'
  retry-images:
    cron: '0 */10 * * * *'
  clean-brands-and-models:
    cron: '0 0 */10 * * *'
  recheck:
    cron: '0 0 * * * *'
    batch-size: '200'
    interval-days: '2'
