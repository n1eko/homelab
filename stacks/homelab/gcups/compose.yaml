services:
  gcups:
    image: ghcr.io/n1eko/gcups:1.1.10
    container_name: gcups
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      - GCUPS_PASSWORD=${GCUPS_PASSWORD}
    volumes:
      - gcups-data:/var/lib/gcups
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - "c 189:* rmw"

  gcups-exporter:
    image: ghcr.io/n1eko/gcups/exporter:latest@sha256:9c6ba93f846511d728a797553f1caea6e4343dab405cc5009622261fbce00fcd
    container_name: gcups-exporter
    restart: unless-stopped
    ports:
      - "9199:9199"
    environment:
      - GCUPS_URL=http://gcups:8080
      - GCUPS_PASSWORD=${GCUPS_PASSWORD}
    depends_on:
      - gcups

volumes:
  gcups-data:
    name: gcups-data
