[[procedure]]
name = "Global Auto Update"
description = "Pulls and auto updates Stacks and Deployments using 'poll_for_updates' or 'auto_update'."
tags = ["system"]
config.schedule = "Every day at 03:00"

[[procedure.config.stage]]
name = "Stage 1"
enabled = true
executions = [
  { execution.type = "GlobalAutoUpdate", execution.params.skip_auto_update = false, enabled = true }
]

##

[[procedure]]
name = "Deploy repo changes"
description = "Applies komodo/main.toml, then redeploys every stack whose files changed in the repo."
tags = ["system"]
config.schedule = "Every hour"

[[procedure.config.stage]]
name = "Sync resources"
enabled = true
executions = [
  { execution.type = "RunSync", execution.params.sync = "resource-sync", enabled = true }
]

[[procedure.config.stage]]
name = "Deploy changed stacks"
enabled = true
executions = [
  { execution.type = "BatchDeployStackIfChanged", execution.params.pattern = "*", enabled = true }
]

